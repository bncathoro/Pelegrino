<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão - Peregrino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-emerald-400 flex items-center justify-center gap-2">
          <i class="fa-solid fa-boxes-stacked"></i> Peregrino App
        </h1>
        <p class="text-xs text-gray-400 mt-1">Insira suas credenciais para acessar o sistema</p>
      </div>

      <form id="login-form" onsubmit="autenticarUsuario(event)" class="space-y-4">
        <div>
          <label for="usuario" class="block text-xs font-semibold text-gray-300 uppercase mb-1">Usuário</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" id="usuario" required autocomplete="username" placeholder="Digite seu usuário"
              class="w-full pl-10 pr-3 py-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
          </div>
        </div>

        <div>
          <label for="senha" class="block text-xs font-semibold text-gray-300 uppercase mb-1">Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="senha" required autocomplete="current-password" placeholder="Digite sua senha"
              class="w-full pl-10 pr-10 py-2.5 bg-gray-900 border border-gray-700 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
            <button type="button" onclick="alternarVisibilidadeSenha()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-white focus:outline-none">
              <i id="icone-olho" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div id="login-erro" class="hidden text-xs text-red-400 bg-red-950/50 border border-red-800 rounded p-2 text-center">
          Usuário ou senha incorretos.
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition duration-200 text-sm flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema
        </button>
      </form>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL (BLOQUEADO ATÉ LOGIN) -->
  <div id="app-content" class="hidden min-h-screen flex flex-col">
    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-40 shadow-md">
      <div class="max-w-4xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked"></i> Peregrino App
        </h1>
        <div class="flex items-center gap-3">
          <span id="status-storage" class="text-xs bg-emerald-950 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-800">
            <i class="fa-solid fa-cloud-arrow-up"></i> Salvo Localmente
          </span>
          <button onclick="deslogar()" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1 rounded-lg border border-gray-600">
            <i class="fa-solid fa-right-from-bracket"></i> Sair
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
      <section class="bg-gray-800 rounded-xl p-5 border border-gray-700 shadow-sm">
        <h2 class="text-lg font-semibold mb-2 text-white">Painel Inicial</h2>
        <p class="text-sm text-gray-400">Login efetuado com sucesso. Aguardando a inclusão do próximo módulo.</p>
      </section>
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 p-4 text-center text-xs text-gray-500">
      Peregrino App &copy; 2026 - Dados persistidos no navegador.
    </footer>
  </div>

  <script>
    const APP_STORAGE_KEY = 'peregrino_app_data_v1';
    
    // Configuração inicial de login (Usuário e Senha de teste padrão)
    const CREDENCIAIS_PADRAO = {
      usuario: 'admin',
      senha: '123'
    };

    let appState = {
      autenticado: false,
      estoque: [],
      consumo: [],
      config: {}
    };

    function carregarDados() {
      const dadosSalvos = localStorage.getItem(APP_STORAGE_KEY);
      if (dadosSalvos) {
        try {
          appState = JSON.parse(dadosSalvos);
        } catch (e) {
          console.error('Erro ao ler dados', e);
        }
      }
      
      // Valida se o usuário já estava logado previamente na sessão
      if (appState.autenticado) {
        exibirApp();
      } else {
        exibirLogin();
      }
    }

    function salvarDados() {
      localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(appState));
    }

    function alternarVisibilidadeSenha() {
      const campoSenha = document.getElementById('senha');
      const iconeOlho = document.getElementById('icone-olho');

      if (campoSenha.type === 'password') {
        campoSenha.type = 'text';
        iconeOlho.classList.remove('fa-eye');
        iconeOlho.classList.add('fa-eye-slash');
      } else {
        campoSenha.type = 'password';
        iconeOlho.classList.remove('fa-eye-slash');
        iconeOlho.classList.add('fa-eye');
      }
    }

    function autenticarUsuario(event) {
      event.preventDefault();
      const usuarioInput = document.getElementById('usuario').value.trim();
      const senhaInput = document.getElementById('senha').value.trim();
      const erroElemento = document.getElementById('login-erro');

      if (usuarioInput === CREDENCIAIS_PADRAO.usuario && senhaInput === CREDENCIAIS_PADRAO.senha) {
        appState.autenticado = true;
        salvarDados();
        erroElemento.classList.add('hidden');
        exibirApp();
      } else {
        erroElemento.classList.remove('hidden');
      }
    }

    function deslogar() {
      appState.autenticado = false;
      salvarDados();
      exibirLogin();
    }

    function exibirApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-content').classList.remove('hidden');
    }

    function exibirLogin() {
      document.getElementById('app-content').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      carregarDados();
    });
  </script>
</body>
</html>
